name: capture
on:
  push:
    branches: [capture]
  workflow_dispatch:
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node shoot.mjs
      - uses: actions/upload-artifact@v4
        with: { name: out, path: out }
